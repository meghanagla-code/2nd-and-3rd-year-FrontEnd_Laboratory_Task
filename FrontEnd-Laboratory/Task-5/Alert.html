<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Eligibility Checker</title>
</head>
<body>
    <h2>Age Eligibility Checker</h2>
    <script>
        // Taking input from the user
        let age =  prompt("Enter your age:"); // 19

        // Converting input into a number
        age = Number(age); 19

        // Checking whether the input is valid // 
        if (age > 0 && Number.isFinite(age) && Number.isInteger(age)) {

            // Using ternary operator
            let result = age >= 18 // 19
                ? "You are eligible to vote."
                : "You are not eligible to vote.";

            // Displaying result using alert()
            alert(result);

            // Displaying result using document.write()
            document.write("<h3>Age: " + age + "</h3>");
            document.write("<h3>" + result + "</h3>");

        } else { // 17
            // Using alert() for invalid input
            alert("Please enter a valid age.");

            document.write("<h3>Invalid age entered!</h3>");
        }

    </script>

</body>
</html>
